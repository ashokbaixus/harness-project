pipeline:
  name: newco-harness-pipeline
  identifier: newcoharnesspipeline
  projectIdentifier: default_project
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: ashokbaixus
        build: <+input>
  stages:
    - stage:
        name: neco-nginx
        identifier: neconginx
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            override: true
          buildIntelligence:
            enabled: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: newcok8s
              namespace: harness-delegate-ng
              automountServiceAccountToken: true
              nodeSelector: {}
              os: Linux
          execution:
            steps:
              - step:
                  type: GitClone
                  name: GitClone_1
                  identifier: GitClone_1
                  spec:
                    connectorRef: ashokbaixus
                    build:
                      type: branch
                      spec:
                        branch: branch1
              - step:
                  type: BuildAndPushDockerRegistry
                  name: BuildAndPushDockerRegistry_1
                  identifier: BuildAndPushDockerRegistry_1
                  spec:
                    connectorRef: newcodockerhub
                    repo: ashokbaixus
                    tags:
                      - newco-nginx-img
          sharedPaths:
            - /var/run
