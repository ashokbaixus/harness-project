pipeline:
  name: newco-harness-pipeline
  identifier: newcoharnesspipeline
  projectIdentifier: default_project
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: ashokbaixus
        build: <+input>
  stages:
    - stage:
        name: neco-nginx
        identifier: neconginx
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            override: true
          buildIntelligence:
            enabled: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: newcok8s
              namespace: harness-delegate-ng
              automountServiceAccountToken: true
              nodeSelector: {}
              os: Linux
          execution:
            steps:
              - step:
                  type: BuildAndPushDockerRegistry
                  name: BuildAndPushDockerRegistry_1
                  identifier: BuildAndPushDockerRegistry_1
                  spec:
                    connectorRef: newcodockerhub
                    repo: ashokbaixus
                    tags:
                      - newco-nginx-img
              - step:
                  type: Grype
                  name: Grype_1
                  identifier: Grype_1
                  spec:
                    mode: orchestration
                    config: default
                    target:
                      type: container
                      detection: auto
                    advanced:
                      log:
                        level: info
                    resources:
                      limits:
                        memory: 2G
                        cpu: 1000m
                    privileged: true
                    image:
                      type: docker_v2
                      tag: latest
                      name: newco-nginx-img
          sharedPaths:
            - /var/run
