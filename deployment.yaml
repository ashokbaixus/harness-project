apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  namespace: harness-delegate-ng
  labels:
    app: nginx
spec:
  serviceAccountName: harness-sa
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80